# .github/workflows/release.yml
name: Rolling release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
      
      - name: Compile PDFs
        run: |
          for lang in en es; do
            typst compile --input lang=$lang main.typ LoaizaCV_$lang.pdf
          done

      - name: Delete previous release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest LoaizaCV_*.pdf \
            --title "Latest" \
            --notes "Automatic build of ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \